name: Release Python engine wheel
on:
  workflow_call:
    inputs:
      engine_dir:
        description: Path to the package to build (a real pyproject.toml lives here)
        required: false
        type: string
        default: engine

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, self-hosted-ci]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up a clean venv
        run: |
          python3 -m venv .ci-venv
          echo "$(pwd)/.ci-venv/bin" >> "$GITHUB_PATH"

      - name: Build sdist + wheel
        run: |
          pip install --disable-pip-version-check -q build
          python -m build --outdir dist "${{ inputs.engine_dir }}"

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
