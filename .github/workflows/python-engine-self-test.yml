name: Python engine self-test

# Push only. A pull_request trigger would execute this checkout on the called
# workflow for untrusted fork code. Same-repo pushes run both call styles.
on:
  push:

permissions:
  contents: read

concurrency:
  group: python-engine-self-test-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  without-python-version:
    name: python-version omitted
    permissions:
      contents: read
      actions: write # upload-artifact in the called build-test workflow
    uses: ./.github/workflows/python-engine-build-test.yml
    with:
      engine_dir: python-self-test

  with-python-3-13:
    name: python-version 3.13
    permissions:
      contents: read
      actions: write # upload-artifact in the called build-test workflow
    uses: ./.github/workflows/python-engine-build-test.yml
    with:
      engine_dir: python-self-test
      python-version: "3.13"
